<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Nano-Banana-Pro</title>
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nano-Banana-Pro">
    <meta name="theme-color" content="#0d9488">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(160deg, #0a0f0e 0%, #0d1a17 50%, #061612 100%);
            min-height: 100vh;
            color: #f0f0f0;
            -webkit-tap-highlight-color: transparent;
        }
        .bg-container {
            background: linear-gradient(170deg, #1a1f1e 0%, #182523 100%);
        }
        .bg-input, .bg-secondary { background-color: #2c302f; color: #f0f0f0; }
        .bg-accent {
            background-image: linear-gradient(135deg, #0d9488 0%, #059669 100%);
            transition: filter 0.15s ease;
        }
        .bg-accent:hover { filter: brightness(1.15); }
        .active-res {
            background-image: linear-gradient(135deg, #14b8a6 0%, #10b981 100%) !important;
            background-color: transparent !important;
            box-shadow: 0 0 12px rgba(20, 184, 166, 0.45);
        }
        .ring-accent:focus { outline: none; box-shadow: 0 0 0 2px #14b8a6; }

        @keyframes pulse-accent {
            0%, 100% { background-image: linear-gradient(135deg, #14b8a6 0%, #10b981 100%); }
            50%      { background-image: linear-gradient(135deg, #0f766e 0%, #047857 100%); }
        }
        .loading-btn { animation: pulse-accent 1.5s infinite; pointer-events: none; opacity: 0.9; }

        .preview-container { position: relative; border-radius: 0.5rem; overflow: hidden; cursor: pointer; }
        .delete-btn {
            position: absolute; top: 4px; right: 4px; width: 22px; height: 22px;
            background: rgba(13, 148, 136, 0.9); border-radius: 50%; color: white;
            display: flex; align-items: center; justify-content: center; font-size: 14px;
        }

        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            z-index: 100; display: none; align-items: center; justify-content: center;
        }

        .history-prompt { cursor: pointer; transition: color 0.15s; }
        .history-prompt:active { color: #5eead4; }
    </style>
</head>
<body class="p-4 flex flex-col items-center">

    <div class="w-full max-w-2xl bg-container p-6 md:p-8 rounded-2xl shadow-2xl">
        <h1 class="text-3xl font-bold text-center mb-6">Nano-Banana-Pro</h1>

        <details id="keyDetails" class="mb-4 bg-input rounded-xl border border-gray-700">
            <summary class="px-4 py-3 cursor-pointer text-sm font-semibold select-none">
                <span id="keyStatus">API Key: not set</span>
            </summary>
            <div class="px-4 pb-4 pt-2">
                <input id="apiKeyInput" type="password" autocomplete="off" placeholder="Paste your Gemini API key"
                    class="w-full bg-secondary p-3 rounded-lg border-none focus:ring-2 focus:ring-teal-400 text-sm mb-2">
                <div class="flex gap-2">
                    <button onclick="saveKey()" class="flex-1 py-2 bg-accent rounded-lg text-sm font-bold active:scale-95 transition">Save</button>
                    <button onclick="clearKey()" class="flex-1 py-2 bg-secondary rounded-lg text-sm font-bold active:scale-95 transition">Clear</button>
                </div>
                <p class="text-[10px] text-gray-500 mt-2">Stored only in this browser's localStorage. Get a key at aistudio.google.com.</p>
            </div>
        </details>

        <div class="flex justify-center mb-4">
            <div class="flex bg-gray-700 p-1 rounded-full">
                <button onclick="setMode('IMAGE')" id="btnModeImage" class="px-6 py-1 rounded-full text-xs font-bold active-res">IMAGE</button>
                <button onclick="setMode('VIDEO')" id="btnModeVideo" class="px-6 py-1 rounded-full text-xs font-bold">VIDEO</button>
            </div>
        </div>

        <div id="imageControls" class="flex justify-between items-center gap-4 mb-6 flex-wrap">
            <div class="flex bg-gray-700 p-1 rounded-full">
                <button onclick="setModel('PRO')" id="btnPRO" class="px-4 py-1 rounded-full text-xs font-bold active-res">PRO</button>
                <button onclick="setModel('FLASH')" id="btnFLASH" class="px-4 py-1 rounded-full text-xs font-bold">FLASH</button>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex bg-gray-700 p-1 rounded-full">
                    <button onclick="setRes('2K')" id="btn2K" class="px-4 py-1 rounded-full text-xs font-bold active-res">2K</button>
                    <button onclick="setRes('4K')" id="btn4K" class="px-4 py-1 rounded-full text-xs font-bold">4K</button>
                </div>
                <select id="aspectRatioSelect" class="bg-input border-none text-sm rounded-lg p-2 focus:ring-2 focus:ring-teal-400">
                </select>
            </div>
        </div>

        <div id="videoControls" class="hidden justify-between items-center gap-4 mb-6 flex-wrap">
            <div class="flex bg-gray-700 p-1 rounded-full">
                <button onclick="setVideoModel('QUALITY')" id="btnVidQ" class="px-3 py-1 rounded-full text-xs font-bold active-res">VEO 3.1</button>
                <button onclick="setVideoModel('FAST')" id="btnVidF" class="px-3 py-1 rounded-full text-xs font-bold">3.1 FAST</button>
            </div>
            <div class="flex items-center gap-2">
                <select id="videoDurationSelect" class="bg-input border-none text-sm rounded-lg p-2 focus:ring-2 focus:ring-teal-400">
                    <option value="4">4s</option>
                    <option value="6">6s</option>
                    <option value="8" selected>8s</option>
                </select>
                <select id="videoAspectSelect" class="bg-input border-none text-sm rounded-lg p-2 focus:ring-2 focus:ring-teal-400">
                    <option value="16:9">16:9</option>
                    <option value="9:16">9:16</option>
                </select>
            </div>
        </div>

        <div class="mb-4 border border-gray-600 rounded-xl bg-input overflow-hidden">
            <label class="block w-full py-4 bg-accent text-center font-bold cursor-pointer  transition">
                <span id="uploadLabel">Upload Source Images</span>
                <input type="file" id="imageUpload" multiple accept="image/*" class="hidden">
            </label>
            <p id="imageCount" class="text-xs text-gray-500 px-3 py-2 text-center">0 images uploaded. Max 20.</p>
        </div>

        <div id="previewGrid" class="grid grid-cols-4 gap-3 mb-4"></div>
        <p id="previewHint" class="text-[10px] text-gray-500 mb-4 hidden">Tap preview to enlarge • Tap X to remove</p>

        <textarea id="prompt" rows="3" placeholder="Describe changes or new image..."
            class="w-full bg-input p-4 rounded-xl border-none focus:ring-2 focus:ring-teal-400 mb-4 resize-none"></textarea>

        <button id="genBtn" onclick="handleGenerate()" class="w-full py-4 bg-accent rounded-xl font-bold shadow-lg active:scale-95 transition mb-6">
            GENERATE
        </button>

        <div class="relative w-full aspect-square bg-black rounded-xl overflow-hidden border border-gray-800">
            <img id="outputImg" class="w-full h-full object-contain" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
            <video id="outputVid" class="w-full h-full object-contain hidden" controls playsinline></video>
        </div>
        <p id="statusMsg" class="text-center text-xs mt-3 text-gray-500 font-medium">Ready</p>
        <button id="downloadBtn" onclick="saveVideo()" class="hidden mt-3 w-full py-2 bg-accent rounded-lg text-sm font-bold active:scale-95 transition">⬇  Save to Photos</button>

        <details id="historyDetails" class="mt-4 bg-input rounded-xl border border-gray-700">
            <summary class="px-4 py-3 cursor-pointer text-sm font-semibold select-none flex justify-between items-center">
                <span>History</span>
                <span id="historyCount" class="text-[10px] text-gray-500 font-normal"></span>
            </summary>
            <div class="px-3 pb-3 pt-1">
                <div id="historyGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div>
                <div class="flex justify-end mt-2">
                    <button id="historyClearBtn" class="text-[10px] text-gray-500 hover:text-teal-400 transition">Clear history</button>
                </div>
            </div>
        </details>
    </div>

    <div id="imageModal" class="modal" onclick="closeEnlarge(event)">
        <img id="modalImg" class="max-w-[95%] max-h-[90vh] shadow-2xl rounded-lg hidden">
        <video id="modalVid" class="max-w-[95%] max-h-[90vh] shadow-2xl rounded-lg hidden" controls playsinline></video>
    </div>

    <script>
        const MODELS = {
            PRO:   "gemini-3-pro-image-preview",
            FLASH: "gemini-3.1-flash-image-preview"
        };
        const VIDEO_MODELS = {
            QUALITY: "veo-3.1-generate-preview",
            FAST:    "veo-3.1-fast-generate-preview"
        };
        const VIDEO_POLL_INTERVAL_MS = 5000;
        const VIDEO_MAX_WAIT_MS = 10 * 60 * 1000;
        const RETRY_DELAY_MS = 2000;

        const API_SUPPORTED_RATIOS = [
            { value: "1:1", label: "1:1 (Square)", ratio: 1 },
            { value: "16:9", label: "16:9 (Landscape)", ratio: 16/9 },
            { value: "9:16", label: "9:16 (Portrait)", ratio: 9/16 },
            { value: "4:3", label: "4:3 (Traditional L)", ratio: 4/3 },
            { value: "3:4", label: "3:4 (Traditional P)", ratio: 3/4 },
            { value: "3:2", label: "3:2 (Photo L)", ratio: 3/2 },
            { value: "2:3", label: "2:3 (Photo P)", ratio: 2/3 },
            { value: "4:5", label: "4:5 (Classic P)", ratio: 4/5 },
            { value: "5:4", label: "5:4 (Classic L)", ratio: 5/4 },
            { value: "21:9", label: "21:9 (Cinematic)", ratio: 21/9 }
        ];

        const KEY_STORAGE = 'nanobanana_api_key';
        let uploadedImages = [];
        let currentRes = "2K";
        let currentModel = "PRO";
        let currentMode = "IMAGE";
        let currentVideoModel = "QUALITY";
        let audioCtx = null;

        const ratioSelect = document.getElementById('aspectRatioSelect');
        API_SUPPORTED_RATIOS.forEach(r => {
            const opt = document.createElement('option');
            opt.value = r.value; opt.textContent = r.label;
            ratioSelect.appendChild(opt);
        });

        function getKey() { return localStorage.getItem(KEY_STORAGE) || ''; }

        function updateKeyStatus() {
            const k = getKey();
            const status = document.getElementById('keyStatus');
            const details = document.getElementById('keyDetails');
            const container = details.parentElement;
            if (k) {
                status.textContent = `API Key: set (…${k.slice(-4)})`;
                details.open = false;
                details.classList.add('mt-2');
                details.classList.remove('mb-4');
                container.appendChild(details);
            } else {
                status.textContent = 'API Key: not set — tap to add';
                details.open = true;
                details.classList.add('mb-4');
                details.classList.remove('mt-2');
                container.insertBefore(details, container.children[1]);
            }
        }

        function saveKey() {
            const v = document.getElementById('apiKeyInput').value.trim();
            if (!v) return;
            localStorage.setItem(KEY_STORAGE, v);
            document.getElementById('apiKeyInput').value = '';
            updateKeyStatus();
        }

        function clearKey() {
            localStorage.removeItem(KEY_STORAGE);
            updateKeyStatus();
        }

        updateKeyStatus();

        function unlockAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playRisingBing(isError = false) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';

            if (isError) {
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
            } else {
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.2);
            }

            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }

        let keepAliveAudio = null;
        let keepAliveUrl = null;

        function buildKeepAliveWav() {
            const sampleRate = 8000;
            const numSamples = sampleRate;
            const dataBytes = numSamples * 2;
            const buf = new ArrayBuffer(44 + dataBytes);
            const view = new DataView(buf);
            view.setUint32(0, 0x52494646, false);
            view.setUint32(4, 36 + dataBytes, true);
            view.setUint32(8, 0x57415645, false);
            view.setUint32(12, 0x666d7420, false);
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            view.setUint32(36, 0x64617461, false);
            view.setUint32(40, dataBytes, true);
            for (let i = 0; i < numSamples; i++) {
                view.setInt16(44 + i * 2, Math.random() < 0.5 ? -1 : 1, true);
            }
            return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
        }

        function startKeepAlive() {
            try {
                if (!keepAliveUrl) keepAliveUrl = buildKeepAliveWav();
                if (!keepAliveAudio) {
                    keepAliveAudio = new Audio(keepAliveUrl);
                    keepAliveAudio.loop = true;
                    keepAliveAudio.volume = 0.01;
                }
                const p = keepAliveAudio.play();
                if (p && p.catch) p.catch((e) => console.warn('keepAlive play failed:', e));
            } catch (e) {
                console.warn('keepAlive start failed:', e);
            }
        }

        function stopKeepAlive() {
            if (!keepAliveAudio) return;
            try {
                keepAliveAudio.pause();
                keepAliveAudio.currentTime = 0;
            } catch (_) {}
        }

        function setRes(val) {
            currentRes = val;
            document.getElementById('btn2K').classList.toggle('active-res', val === '2K');
            document.getElementById('btn4K').classList.toggle('active-res', val === '4K');
        }

        function setModel(val) {
            currentModel = val;
            document.getElementById('btnPRO').classList.toggle('active-res', val === 'PRO');
            document.getElementById('btnFLASH').classList.toggle('active-res', val === 'FLASH');
        }

        function setMode(val) {
            currentMode = val;
            document.getElementById('btnModeImage').classList.toggle('active-res', val === 'IMAGE');
            document.getElementById('btnModeVideo').classList.toggle('active-res', val === 'VIDEO');
            const imgCtl = document.getElementById('imageControls');
            const vidCtl = document.getElementById('videoControls');
            const uploadLabel = document.getElementById('uploadLabel');
            const promptEl = document.getElementById('prompt');
            if (val === 'VIDEO') {
                imgCtl.classList.add('hidden');
                vidCtl.classList.remove('hidden');
                vidCtl.classList.add('flex');
                uploadLabel.textContent = 'Upload Reference Image (optional)';
                promptEl.placeholder = 'Describe the video you want to create…';
            } else {
                vidCtl.classList.add('hidden');
                vidCtl.classList.remove('flex');
                imgCtl.classList.remove('hidden');
                uploadLabel.textContent = 'Upload Source Images';
                promptEl.placeholder = 'Describe changes or new image...';
            }
        }

        function setVideoModel(val) {
            currentVideoModel = val;
            document.getElementById('btnVidQ').classList.toggle('active-res', val === 'QUALITY');
            document.getElementById('btnVidF').classList.toggle('active-res', val === 'FAST');
        }

        function findClosestRatio(actualRatio) {
            return API_SUPPORTED_RATIOS.reduce((prev, curr) =>
                Math.abs(curr.ratio - actualRatio) < Math.abs(prev.ratio - actualRatio) ? curr : prev
            );
        }

        document.getElementById('imageUpload').addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                if (uploadedImages.length >= 20) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const tempImg = new Image();
                    tempImg.onload = () => {
                        if (uploadedImages.length === 0) {
                            const best = findClosestRatio(tempImg.width / tempImg.height);
                            ratioSelect.value = best.value;
                        }
                        const id = Date.now() + Math.random();
                        uploadedImages.push({ id, data: ev.target.result.split(',')[1], mime: file.type, url: ev.target.result });
                        renderPreviews();
                    };
                    tempImg.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            });
        });

        function renderPreviews() {
            const grid = document.getElementById('previewGrid');
            const count = document.getElementById('imageCount');
            const hint = document.getElementById('previewHint');
            grid.innerHTML = '';

            uploadedImages.forEach(img => {
                const div = document.createElement('div');
                div.className = "preview-container aspect-square bg-secondary";
                div.innerHTML = `
                    <img src="${img.url}" class="w-full h-full object-cover" onclick="enlarge('${img.url}')">
                    <button class="delete-btn" onclick="removeImg(${img.id})">&times;</button>
                `;
                grid.appendChild(div);
            });

            count.textContent = `${uploadedImages.length} images uploaded. Max 20.`;
            hint.classList.toggle('hidden', uploadedImages.length === 0);
        }

        function removeImg(id) {
            uploadedImages = uploadedImages.filter(i => i.id !== id);
            renderPreviews();
        }

        function enlarge(url, kind) {
            const modal = document.getElementById('imageModal');
            const img = document.getElementById('modalImg');
            const vid = document.getElementById('modalVid');
            if (kind === 'video') {
                img.classList.add('hidden');
                img.removeAttribute('src');
                vid.classList.remove('hidden');
                vid.src = url;
                vid.play().catch(() => {});
            } else {
                vid.pause();
                vid.removeAttribute('src');
                vid.load();
                vid.classList.add('hidden');
                img.classList.remove('hidden');
                img.src = url;
            }
            modal.style.display = 'flex';
        }

        function closeEnlarge(e) {
            if (e && e.target.tagName === 'VIDEO') return;
            const modal = document.getElementById('imageModal');
            const vid = document.getElementById('modalVid');
            vid.pause();
            vid.removeAttribute('src');
            vid.load();
            modal.style.display = 'none';
        }

        async function saveVideo(srcArg, btnEl) {
            const src = srcArg || document.getElementById('outputVid').getAttribute('src');
            if (!src) return;
            const btn = btnEl || document.getElementById('downloadBtn');
            const orig = btn ? btn.textContent : null;
            if (btn) { btn.disabled = true; btn.textContent = 'Preparing…'; }
            try {
                const resp = await fetch(src);
                const blob = await resp.blob();
                const filename = `nanobanana-${Date.now()}.mp4`;
                const file = new File([blob], filename, { type: 'video/mp4' });

                if (navigator.share) {
                    try {
                        await navigator.share({ files: [file], title: filename });
                        return;
                    } catch (err) {
                        if (err && err.name === 'AbortError') return;
                        console.warn('share() failed, falling back to download:', err);
                    }
                }

                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 30000);
            } catch (e) {
                if (e && e.name === 'AbortError') return;
                console.error('Save failed:', e);
                alert(`Save failed: ${e.message || e}`);
            } finally {
                if (btn && orig !== null) { btn.disabled = false; btn.textContent = orig; }
            }
        }

        const HISTORY_DB = 'nb-history';
        const HISTORY_STORE = 'images';
        const HISTORY_MAX_IMAGE = 100;
        const HISTORY_MAX_VIDEO = 10;

        function openHistoryDb() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(HISTORY_DB, 1);
                req.onupgradeneeded = () => {
                    const db = req.result;
                    if (!db.objectStoreNames.contains(HISTORY_STORE)) {
                        const s = db.createObjectStore(HISTORY_STORE, { keyPath: 'id', autoIncrement: true });
                        s.createIndex('timestamp', 'timestamp');
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function addToHistory(record) {
            if (!record.type) record.type = 'image';
            try {
                const db = await openHistoryDb();
                await new Promise((resolve, reject) => {
                    const tx = db.transaction(HISTORY_STORE, 'readwrite');
                    tx.objectStore(HISTORY_STORE).add(record);
                    tx.oncomplete = resolve;
                    tx.onerror = () => reject(tx.error);
                });
                await new Promise((resolve) => {
                    const tx = db.transaction(HISTORY_STORE, 'readwrite');
                    const store = tx.objectStore(HISTORY_STORE);
                    const counts = { image: 0, video: 0 };
                    const caps = { image: HISTORY_MAX_IMAGE, video: HISTORY_MAX_VIDEO };
                    const cursorReq = store.index('timestamp').openCursor(null, 'prev');
                    cursorReq.onsuccess = (e) => {
                        const c = e.target.result;
                        if (!c) return;
                        const t = (c.value && c.value.type) || 'image';
                        counts[t] = (counts[t] || 0) + 1;
                        if (counts[t] > (caps[t] || HISTORY_MAX_IMAGE)) c.delete();
                        c.continue();
                    };
                    cursorReq.onerror = () => resolve();
                    tx.oncomplete = resolve;
                });
                db.close();
                updateHistoryCount();
            } catch (e) {
                console.warn('history write failed:', e);
            }
        }

        async function getHistory() {
            try {
                const db = await openHistoryDb();
                const items = await new Promise((resolve) => {
                    const tx = db.transaction(HISTORY_STORE, 'readonly');
                    const req = tx.objectStore(HISTORY_STORE).getAll();
                    req.onsuccess = () => resolve(req.result || []);
                    req.onerror = () => resolve([]);
                });
                db.close();
                return items.sort((a, b) => b.timestamp - a.timestamp);
            } catch (e) {
                return [];
            }
        }

        async function clearHistory() {
            try {
                const db = await openHistoryDb();
                await new Promise((resolve) => {
                    const tx = db.transaction(HISTORY_STORE, 'readwrite');
                    tx.objectStore(HISTORY_STORE).clear();
                    tx.oncomplete = resolve;
                    tx.onerror = resolve;
                });
                db.close();
            } catch (_) {}
        }

        function formatTime(ts) {
            const d = new Date(ts);
            const today = new Date();
            const sameDay = d.toDateString() === today.toDateString();
            const opts = sameDay
                ? { hour: '2-digit', minute: '2-digit' }
                : { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
            return d.toLocaleString(undefined, opts);
        }

        async function renderHistory() {
            const grid = document.getElementById('historyGrid');
            const items = await getHistory();
            grid.innerHTML = '';
            if (items.length === 0) {
                grid.innerHTML = '<p class="col-span-2 sm:col-span-3 text-center text-xs text-gray-500 py-6">No images yet.</p>';
                return;
            }
            items.forEach(item => {
                const isVideo = item.type === 'video';
                const card = document.createElement('div');
                card.className = 'bg-secondary rounded-lg overflow-hidden flex flex-col';

                const imgWrap = document.createElement('div');
                imgWrap.className = 'aspect-square bg-black cursor-pointer relative';
                if (isVideo) {
                    const vid = document.createElement('video');
                    vid.src = item.dataUrl;
                    vid.muted = true;
                    vid.playsInline = true;
                    vid.preload = 'metadata';
                    vid.className = 'w-full h-full object-cover pointer-events-none';
                    imgWrap.appendChild(vid);
                    const badge = document.createElement('div');
                    badge.textContent = '▶';
                    badge.className = 'absolute inset-0 flex items-center justify-center text-white text-3xl drop-shadow-lg opacity-80 pointer-events-none';
                    imgWrap.appendChild(badge);
                    imgWrap.addEventListener('click', () => enlarge(item.dataUrl, 'video'));
                } else {
                    const img = document.createElement('img');
                    img.src = item.dataUrl;
                    img.loading = 'lazy';
                    img.className = 'w-full h-full object-cover';
                    imgWrap.appendChild(img);
                    imgWrap.addEventListener('click', () => enlarge(item.dataUrl, 'image'));
                }

                const meta = document.createElement('div');
                meta.className = 'p-2 text-xs flex-1 flex flex-col gap-1';
                meta.innerHTML = `
                    <div class="text-[10px] text-gray-400 font-semibold tracking-wide flex justify-between gap-2">
                        <span>${item.model} • ${item.res} • ${item.ratio}</span>
                        <span class="text-gray-500 font-normal whitespace-nowrap">${formatTime(item.timestamp)}</span>
                    </div>
                    <div class="history-prompt text-[11px] text-gray-200 leading-snug break-words" title="Tap to copy"></div>
                `;
                const promptEl = meta.querySelector('.history-prompt');
                promptEl.textContent = item.prompt;
                promptEl.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const original = item.prompt;
                    try {
                        await navigator.clipboard.writeText(original);
                    } catch (_) {
                        const ta = document.createElement('textarea');
                        ta.value = original; ta.style.position = 'fixed'; ta.style.opacity = '0';
                        document.body.appendChild(ta); ta.select();
                        try { document.execCommand('copy'); } catch (__) {}
                        document.body.removeChild(ta);
                    }
                    const originalColor = promptEl.style.color;
                    promptEl.textContent = '✓ Copied';
                    promptEl.style.color = '#5eead4';
                    setTimeout(() => {
                        promptEl.textContent = original;
                        promptEl.style.color = originalColor;
                    }, 1100);
                });

                if (isVideo) {
                    const saveBtn = document.createElement('button');
                    saveBtn.textContent = '⬇ Save to Photos';
                    saveBtn.className = 'mt-1 self-start text-[10px] text-gray-400 hover:text-teal-400 transition active:scale-95';
                    saveBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        saveVideo(item.dataUrl, saveBtn);
                    });
                    meta.appendChild(saveBtn);
                }

                card.appendChild(imgWrap);
                card.appendChild(meta);
                grid.appendChild(card);
            });
        }

        async function updateHistoryCount() {
            try {
                const db = await openHistoryDb();
                const counts = await new Promise((resolve) => {
                    const tx = db.transaction(HISTORY_STORE, 'readonly');
                    const store = tx.objectStore(HISTORY_STORE);
                    const c = { image: 0, video: 0 };
                    const cur = store.openCursor();
                    cur.onsuccess = (e) => {
                        const k = e.target.result;
                        if (!k) { resolve(c); return; }
                        const t = (k.value && k.value.type) || 'image';
                        c[t] = (c[t] || 0) + 1;
                        k.continue();
                    };
                    cur.onerror = () => resolve(c);
                });
                db.close();
                const el = document.getElementById('historyCount');
                if (!counts.image && !counts.video) el.textContent = '';
                else if (!counts.video) el.textContent = `${counts.image} / ${HISTORY_MAX_IMAGE}`;
                else if (!counts.image) el.textContent = `${counts.video} / ${HISTORY_MAX_VIDEO} vid`;
                else el.textContent = `${counts.image}/${HISTORY_MAX_IMAGE} img • ${counts.video}/${HISTORY_MAX_VIDEO} vid`;
            } catch (_) {}
        }

        document.getElementById('historyDetails').addEventListener('toggle', (e) => {
            if (e.target.open) renderHistory();
        });
        document.getElementById('historyClearBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            if (!confirm('Clear all history?')) return;
            await clearHistory();
            await renderHistory();
            updateHistoryCount();
        });
        updateHistoryCount();

        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

        const PENDING_KEY = 'nb_pending_request_id';
        const pendingResolvers = new Map();
        let swReadyPromise = null;

        function ensureServiceWorker() {
            if (swReadyPromise) return swReadyPromise;
            if (!('serviceWorker' in navigator)) return Promise.resolve(null);
            swReadyPromise = (async () => {
                try {
                    await navigator.serviceWorker.register('sw.js');
                    await navigator.serviceWorker.ready;
                    if (!navigator.serviceWorker.controller) {
                        await new Promise(resolve => {
                            const handler = () => {
                                navigator.serviceWorker.removeEventListener('controllerchange', handler);
                                resolve();
                            };
                            navigator.serviceWorker.addEventListener('controllerchange', handler);
                            setTimeout(resolve, 1500);
                        });
                    }
                    return navigator.serviceWorker.controller;
                } catch (e) {
                    console.warn('SW registration failed:', e);
                    return null;
                }
            })();
            return swReadyPromise;
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.addEventListener('message', (e) => {
                const msg = e.data;
                if (!msg || msg.type !== 'result') return;
                const r = pendingResolvers.get(msg.id);
                if (!r) return;
                pendingResolvers.delete(msg.id);
                if (sessionStorage.getItem(PENDING_KEY) === msg.id) {
                    sessionStorage.removeItem(PENDING_KEY);
                }
                navigator.serviceWorker.controller && navigator.serviceWorker.controller.postMessage({ type: 'ack', id: msg.id });
                if (msg.ok) r.resolve(msg.data);
                else r.reject(new Error(msg.error || 'Generation failed'));
            });
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState !== 'visible') return;
            const pendingId = sessionStorage.getItem(PENDING_KEY);
            if (pendingId && pendingResolvers.has(pendingId) && navigator.serviceWorker.controller) {
                navigator.serviceWorker.controller.postMessage({ type: 'check', id: pendingId });
            }
        });

        ensureServiceWorker();

        function buildBody(modelKey, parts) {
            const modalities = modelKey === 'FLASH' ? ['IMAGE'] : ['TEXT', 'IMAGE'];
            return {
                contents: [{ role: 'user', parts }],
                generationConfig: {
                    responseModalities: modalities,
                    imageConfig: {
                        imageSize: currentRes,
                        aspectRatio: ratioSelect.value
                    }
                }
            };
        }

        async function callApi(modelKey, body) {
            const apiKey = getKey();
            const modelId = MODELS[modelKey];
            const controller = await ensureServiceWorker();
            if (controller) {
                const id = (crypto.randomUUID && crypto.randomUUID()) || `${Date.now()}-${Math.random()}`;
                sessionStorage.setItem(PENDING_KEY, id);
                const promise = new Promise((resolve, reject) => {
                    pendingResolvers.set(id, { resolve, reject });
                });
                controller.postMessage({ type: 'generate', id, modelId, apiKey, body });
                return promise;
            }
            const response = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/${modelId}:generateContent?key=${encodeURIComponent(apiKey)}`,
                {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                }
            );
            if (!response.ok) {
                let errMsg = `HTTP ${response.status}`;
                try {
                    const errData = await response.json();
                    if (errData.error && errData.error.message) errMsg = errData.error.message;
                } catch (_) {}
                throw new Error(errMsg);
            }
            const data = await response.json();
            if (data.error) throw new Error(data.error.message || "API Error");
            return data;
        }

        async function attemptGenerate(modelKey, parts) {
            const data = await callApi(modelKey, buildBody(modelKey, parts));
            if (!data.candidates || !data.candidates[0]) throw new Error("No candidates returned (possible safety block)");

            const responseParts = data.candidates[0].content && data.candidates[0].content.parts;
            if (!responseParts || responseParts.length === 0) throw new Error("Empty response content");

            const imagePart = responseParts.find(p => p.inlineData && p.inlineData.data);
            if (!imagePart) {
                const textPart = responseParts.find(p => p.text);
                throw new Error(textPart ? `No image returned. Model said: ${textPart.text.slice(0, 120)}` : "No image in response");
            }
            return imagePart;
        }

        async function startVideoOperation(modelId, body) {
            const apiKey = getKey();
            const resp = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/${modelId}:predictLongRunning?key=${encodeURIComponent(apiKey)}`,
                {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                }
            );
            if (!resp.ok) {
                let msg = `HTTP ${resp.status}`;
                try { const e = await resp.json(); if (e.error && e.error.message) msg = e.error.message; } catch (_) {}
                throw new Error(msg);
            }
            const data = await resp.json();
            if (!data.name) throw new Error('Video API returned no operation name');
            return data.name;
        }

        async function pollVideoOperation(opName, statusEl, startMs) {
            const apiKey = getKey();
            while (true) {
                if (Date.now() - startMs > VIDEO_MAX_WAIT_MS) {
                    throw new Error(`Timed out after ${Math.round(VIDEO_MAX_WAIT_MS/60000)} min`);
                }
                await sleep(VIDEO_POLL_INTERVAL_MS);
                const elapsed = Math.floor((Date.now() - startMs) / 1000);
                statusEl.textContent = `Rendering video… ${elapsed}s (safe to background)`;
                const resp = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/${opName}?key=${encodeURIComponent(apiKey)}`
                );
                if (!resp.ok) {
                    let msg = `HTTP ${resp.status}`;
                    try { const e = await resp.json(); if (e.error && e.error.message) msg = e.error.message; } catch (_) {}
                    throw new Error(msg);
                }
                const data = await resp.json();
                if (data.done) {
                    if (data.error) throw new Error(data.error.message || 'Operation failed');
                    return data.response;
                }
            }
        }

        function extractVideoUri(response) {
            if (!response) return null;
            const candidates = [
                response.generateVideoResponse && response.generateVideoResponse.generatedSamples,
                response.generatedSamples,
                response.videos,
                response.generated_videos
            ].find(Array.isArray) || [];
            for (const s of candidates) {
                if (s && s.video && s.video.uri) return s.video.uri;
                if (s && s.uri) return s.uri;
            }
            return null;
        }

        async function fetchVideoAsDataUrl(uri) {
            const apiKey = getKey();
            const sep = uri.includes('?') ? '&' : '?';
            const resp = await fetch(`${uri}${sep}key=${encodeURIComponent(apiKey)}`);
            if (!resp.ok) throw new Error(`Video download HTTP ${resp.status}`);
            const blob = await resp.blob();
            return new Promise((resolve, reject) => {
                const r = new FileReader();
                r.onload = () => resolve(r.result);
                r.onerror = () => reject(new Error('Failed to read video blob'));
                r.readAsDataURL(blob);
            });
        }

        async function handleVideoGenerate(prompt, status, genBtn) {
            const modelLabel = currentVideoModel === 'FAST' ? 'Veo 3.1 Fast' : 'Veo 3.1';
            const modelId = VIDEO_MODELS[currentVideoModel];
            const aspect = document.getElementById('videoAspectSelect').value;
            const duration = parseInt(document.getElementById('videoDurationSelect').value, 10);

            const instance = { prompt };
            if (uploadedImages.length > 0) {
                instance.image = {
                    bytesBase64Encoded: uploadedImages[0].data,
                    mimeType: uploadedImages[0].mime
                };
            }

            const body = {
                instances: [instance],
                parameters: {
                    aspectRatio: aspect,
                    durationSeconds: duration,
                    personGeneration: 'allow_adult'
                }
            };

            status.textContent = `Starting ${modelLabel}…`;
            const opName = await startVideoOperation(modelId, body);

            const startMs = Date.now();
            const response = await pollVideoOperation(opName, status, startMs);

            const uri = extractVideoUri(response);
            if (!uri) {
                console.error('No video URI in response:', response);
                throw new Error('No video URI in response');
            }

            status.textContent = 'Downloading video…';
            const dataUrl = await fetchVideoAsDataUrl(uri);

            const outImg = document.getElementById('outputImg');
            const outVid = document.getElementById('outputVid');
            outImg.classList.add('hidden');
            outVid.classList.remove('hidden');
            outVid.src = dataUrl;
            outVid.play().catch(() => {});
            document.getElementById('downloadBtn').classList.remove('hidden');

            addToHistory({
                type: 'video',
                dataUrl,
                prompt,
                model: modelLabel,
                res: `${duration}s`,
                ratio: aspect,
                timestamp: Date.now()
            });

            finish(false);
        }

        async function handleGenerate() {
            unlockAudio();
            const prompt = document.getElementById('prompt').value;
            const genBtn = document.getElementById('genBtn');
            const status = document.getElementById('statusMsg');
            const outImg = document.getElementById('outputImg');
            const outVid = document.getElementById('outputVid');

            if (!getKey()) {
                playRisingBing(true);
                document.getElementById('keyDetails').open = true;
                return alert("API key required. Add it in the panel.");
            }

            if (!prompt) {
                playRisingBing(true);
                return alert("Prompt required");
            }

            genBtn.classList.add('loading-btn');
            genBtn.textContent = "PROCESSING...";
            status.style.color = "#a0a0a0";
            document.getElementById('downloadBtn').classList.add('hidden');
            startKeepAlive();

            if (currentMode === 'VIDEO') {
                try {
                    await handleVideoGenerate(prompt, status, genBtn);
                } catch (err) {
                    console.error('Video generation failed:', err);
                    finish(true, err.message);
                }
                return;
            }

            status.textContent = `Crafting your image with ${currentModel}… (safe to background)`;
            outVid.pause();
            outVid.classList.add('hidden');
            outImg.classList.remove('hidden');

            const parts = uploadedImages.map(img => ({ inlineData: { mimeType: img.mime, data: img.data } }));
            parts.push({ text: prompt });

            let imagePart;
            let usedModel = currentModel;
            try {
                imagePart = await attemptGenerate(currentModel, parts);
            } catch (firstErr) {
                console.error(`First attempt (${currentModel}) failed:`, firstErr);
                status.textContent = `${currentModel} failed: ${firstErr.message}. Retrying with FLASH…`;
                await sleep(RETRY_DELAY_MS);
                try {
                    imagePart = await attemptGenerate('FLASH', parts);
                    usedModel = 'FLASH';
                } catch (secondErr) {
                    console.error("FLASH fallback failed:", secondErr);
                    return finish(true, `Both attempts failed. ${secondErr.message}`);
                }
            }

            const b64 = imagePart.inlineData.data;
            const mime = imagePart.inlineData.mimeType || 'image/png';
            const newUrl = `data:${mime};base64,${b64}`;

            addToHistory({
                type: 'image',
                dataUrl: newUrl,
                prompt: prompt,
                model: usedModel,
                res: currentRes,
                ratio: ratioSelect.value,
                timestamp: Date.now()
            });

            const temp = new Image();
            temp.onload = () => {
                outImg.src = newUrl;
                finish(false);
            };
            temp.onerror = () => finish(true, "Failed to decode image");
            temp.src = newUrl;
        }

        function finish(isError, errMsg) {
            stopKeepAlive();
            const genBtn = document.getElementById('genBtn');
            const status = document.getElementById('statusMsg');

            genBtn.classList.remove('loading-btn');
            genBtn.textContent = "GENERATE";

            if (isError) {
                status.textContent = errMsg ? `Error: ${errMsg}` : "Error: Prompt blocked or Server busy.";
                status.style.color = "#f87171";
            } else {
                status.textContent = "Generation Complete";
                status.style.color = "#a0a0a0";
            }

            playRisingBing(isError);
            if (navigator.vibrate) navigator.vibrate(200);
        }
    </script>
</body>
